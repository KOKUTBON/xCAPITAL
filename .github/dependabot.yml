version: 2
updates:
  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 0
    directory: "/"
    schedule:
      interval: "weekly"

  # Backend Maven microservices
  - package-ecosystem: "maven"
    open-pull-requests-limit: 0
    directory: "/backend/auth-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "maven"
    open-pull-requests-limit: 0
    directory: "/backend/gateway"
    schedule:
      interval: "weekly"

  - package-ecosystem: "maven"
    open-pull-requests-limit: 0
    directory: "/backend/portfolio-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "maven"
    open-pull-requests-limit: 0
    directory: "/backend/simulation-service"
    schedule:
      interval: "weekly"

  # Frontend Angular web client
  - package-ecosystem: "npm"
    open-pull-requests-limit: 0
    directory: "/frontend/web"
    schedule:
      interval: "weekly"

  # Mobile Flutter application
  - package-ecosystem: "pub"
    open-pull-requests-limit: 0
    directory: "/mobile/xcapital_app"
    schedule:
      interval: "weekly"

  # Python AI and Math tooling
  - package-ecosystem: "pip"
    open-pull-requests-limit: 0
    directory: "/ai/ai-service"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    open-pull-requests-limit: 0
    directory: "/math-library/tools"
    schedule:
      interval: "weekly"

  # Docker container configurations
  - package-ecosystem: "docker"
    open-pull-requests-limit: 0
    directory: "/"
    schedule:
      interval: "weekly"
