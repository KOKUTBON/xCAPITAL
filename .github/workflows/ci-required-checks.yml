name: CI Required Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-required-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ai-python-test:
    name: ai-python-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai/ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ai/ai-service/requirements.txt
            ai/ai-service/requirements-test.txt

      - name: Install AI test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run AI API regression checks
        run: python -m unittest discover -s tests -v

  backend-maven-test:
    name: backend-maven-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend Maven tests
        shell: bash
        run: |
          set -euo pipefail
          for svc in auth-service gateway portfolio-service simulation-service; do
            echo "==> ${svc}"
            (cd "backend/${svc}" && mvn -B -q test)
          done

  tenant-isolation-matrix:
    name: tenant-isolation-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tenant isolation matrix
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/tenant_isolation_matrix.sh

  frontend-web-build:
    name: frontend-web-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web app
        run: npm run build

  mobile-flutter-quality:
    name: mobile-flutter-quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile/xcapital_app
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter test (if present)
        shell: bash
        run: |
          set -euo pipefail
          unit_tests="$(find test -name '*_test.dart' ! -path 'test/integration/*')"
          if [ -n "${unit_tests}" ]; then
            # shellcheck disable=SC2086
            flutter test ${unit_tests}
          else
            echo "No non-integration Flutter tests found; skipping unit test step."
          fi

      - name: Flutter integration tests (if present)
        shell: bash
        run: |
          set -euo pipefail
          if [ -d test/integration ] && find test/integration -name '*_test.dart' -print -quit | grep -q .; then
            flutter test test/integration
          else
            echo "No Flutter integration tests found; skipping integration test step."
          fi

  docs-policy-check:
    name: docs-policy-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate CI policy references
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/CI_BRANCH_PROTECTION_POLICY.md
          test -f docs/TENANT_ISOLATION_MATRIX.md
          test -f docs/RELEASE_READINESS_CHECKLIST.md
          test -f docs/VENDOR_REGISTER.md
          grep -n "CI & Branch Protection Policy" docs/README.md
          grep -n "Tenant Isolation Security Regression Matrix" docs/README.md
          grep -n "Release Readiness Checklist and vNext Acceptance" docs/README.md
          grep -n "Deployment Vendor Register" docs/README.md
          grep -n "Release Readiness Gate" docs/CI_BRANCH_PROTECTION_POLICY.md
          grep -n "tenant-isolation-matrix" docs/CI_BRANCH_PROTECTION_POLICY.md
          grep -n "gateway-e2e-smoke" docs/CI_BRANCH_PROTECTION_POLICY.md
          grep -n "docs/TEST_STRATEGY.md" docs/CI_BRANCH_PROTECTION_POLICY.md
          grep -n "docs/RELEASE_READINESS_CHECKLIST.md" docs/CI_BRANCH_PROTECTION_POLICY.md
          bash scripts/ci/vendor_register_check.sh

  gateway-e2e-smoke:
    name: gateway-e2e-smoke
    uses: ./.github/workflows/gateway-smoke.yml
