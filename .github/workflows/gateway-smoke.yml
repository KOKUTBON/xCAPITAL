name: Gateway E2E Smoke

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  gateway-smoke:
    name: gateway-e2e-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run gateway smoke flow
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/smoke/gateway_e2e_smoke.sh --start-stack --cleanup
